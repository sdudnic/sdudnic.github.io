name: Update Europa news feed

on:
  # Refresh the snapshot every day; manual runs remain available for testing
  # or an immediate refresh after an important EU-related event.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect and deduplicate external notes
        run: python scripts/update_europa_feed.py

      - name: Commit a changed snapshot
        shell: bash
        run: |
          if git diff --quiet -- _data/europa_auto.yml; then
            echo "No valid feed changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/europa_auto.yml
          git commit -m "Refresh Europa news feed"
          git push
