- date: 2026-07-21
  source: Associated Press
  url: "https://apnews.com/article/22c8c6d3298d3f00b09fd0c1c065bcac"
  mo_title: "Parlamentul îl alege pe Vasile Tofan prim-ministru pentru avansarea candidaturii la UE"
  mo_summary: "Parlamentul l-a votat pe Vasile Tofan în funcția de prim-ministru, iar AP leagă noul mandat de obiectivul avansării candidaturii Moldovei la Uniunea Europeană."
  en_title: "Moldova’s parliament elects Vasile Tofan as prime minister to advance the EU bid"
  en_summary: "Parliament elected Vasile Tofan prime minister, and the Associated Press links the new mandate to advancing Moldova’s bid to join the European Union."
  fr_title: "Le Parlement moldave élit Vasile Tofan Premier ministre pour faire avancer la candidature à l’UE"
  fr_summary: "Le Parlement a élu Vasile Tofan Premier ministre; l’Associated Press relie ce mandat à l’objectif de faire progresser la candidature de la Moldova à l’Union européenne."
  ru_title: "Парламент Молдовы избрал Василе Тофана премьер-министром для продвижения заявки на вступление в ЕС"
  ru_summary: "Парламент избрал Василе Тофана премьер-министром; Associated Press связывает новый мандат с продвижением заявки Молдовы на вступление в Европейский союз."

- date: 2026-07-14
  source: Comisia Europeană — Enlargement
  url: "https://enlargement.ec.europa.eu/news/enlargement-eu-and-moldova-start-negotiations-external-relations-policies-2026-07-14_en"
  mo_title: "Moldova deschide negocierile pentru grupul «Relații externe»"
  mo_summary: "UE și Republica Moldova au deschis clusterul 6 al negocierilor de aderare, care acoperă politica comercială, relațiile externe, securitatea și apărarea. Evoluția depinde de reforme și de alinierea la acquis-ul UE."
  en_title: "Moldova opens negotiations on the ‘External relations’ cluster"
  en_summary: "The EU and Moldova opened Cluster 6 of the accession negotiations, covering trade policy, external relations, security and defence. Progress remains tied to reforms and alignment with the EU acquis."
  fr_title: "La Moldova ouvre les négociations sur le groupe « Relations extérieures »"
  fr_summary: "L’UE et la Moldova ont ouvert le groupe 6 des négociations d’adhésion, consacré à la politique commerciale, aux relations extérieures, à la sécurité et à la défense. Les progrès restent liés aux réformes et à l’alignement sur l’acquis de l’UE."
  ru_title: "Молдова открыла переговоры по кластеру «Внешние отношения»"
  ru_summary: "ЕС и Молдова открыли шестой кластер переговоров о вступлении, охватывающий торговую политику, внешние отношения, безопасность и оборону. Прогресс зависит от реформ и согласования с правом ЕС."

- date: 2026-07-06
  source: Parlamentul European
  url: "https://www.europarl.europa.eu/pdfs/news/expert/2026/7/press_release/20260706IPR46313/20260706IPR46313_en.pdf"
  mo_title: "Eurodeputații salută reformele Moldovei și cer sprijin mai puternic pentru parcursul european"
  mo_summary: "O declarație a Parlamentului European evidențiază progresele pe calea aderării și cere sprijin pentru reforme, integrarea în piața UE, energie și reziliență în fața ingerințelor."
  en_title: "Members of the European Parliament welcome Moldova’s reforms and call for stronger support"
  en_summary: "A European Parliament statement highlights progress on the accession path and calls for support on reforms, EU market integration, energy and resilience against interference."
  fr_title: "Les députés européens saluent les réformes de la Moldova et demandent un soutien renforcé"
  fr_summary: "Une déclaration du Parlement européen souligne les progrès sur la voie de l’adhésion et appelle à soutenir les réformes, l’intégration au marché de l’UE, l’énergie et la résilience face aux ingérences."
  ru_title: "Европарламентарии приветствуют реформы Молдовы и призывают усилить поддержку"
  ru_summary: "В заявлении Европейского парламента отмечается прогресс на пути к вступлению и необходимость поддержки реформ, интеграции в рынок ЕС, энергетики и устойчивости к вмешательству."

- date: 2026-06-23
  source: Comisia Europeană — Enlargement
  url: "https://enlargement.ec.europa.eu/news/eu-launches-connectivity-agenda-platform-strengthen-links-between-europe-and-central-asia-through-2026-06-23_en"
  mo_title: "Platforma UE pentru conectivitate include Moldova în noi legături prin regiunea Mării Negre"
  mo_summary: "Comisia Europeană a lansat platforma și acorduri cu instituții financiare ce ar putea mobiliza până la 2 miliarde € pentru transport, energie, conectivitate digitală și comerț; Moldova a participat la reuniune."
  en_title: "The EU’s Connectivity Agenda Platform includes Moldova in new Black Sea links"
  en_summary: "The European Commission launched a platform and agreements that could mobilise up to €2 billion for transport, energy, digital connectivity and trade; Moldova took part in the meeting."
  fr_title: "La plateforme de connectivité de l’UE inclut la Moldova dans de nouveaux corridors de la mer Noire"
  fr_summary: "La Commission européenne a lancé une plateforme et des accords susceptibles de mobiliser jusqu’à 2 milliards d’euros pour les transports, l’énergie, le numérique et le commerce; la Moldova a participé à la réunion."
  ru_title: "Платформа ЕС по взаимосвязанности включает Молдову в новые связи через Чёрное море"
  ru_summary: "Европейская комиссия запустила платформу и договорённости, которые могут мобилизовать до 2 млрд евро для транспорта, энергетики, цифровой связи и торговли; Молдова участвовала во встрече."

- date: 2026-06-22
  source: Comisia Europeană — Enlargement
  url: "https://enlargement.ec.europa.eu/news/eu-moldova-summit-brussels-marks-new-milestone-path-eu-membership-2026-06-22_en"
  mo_title: "Summitul UE–Moldova de la Bruxelles marchează un nou pas spre aderare"
  mo_summary: "Liderii UE și ai Moldovei au analizat negocierile, reformele și Planul de creștere după deschiderea primului cluster. Comisia notează că Moldova a deblocat aproximativ 504 milioane € din facilitatea de creștere."
  en_title: "The EU–Moldova summit in Brussels marks a new step towards membership"
  en_summary: "EU and Moldovan leaders reviewed accession talks, reforms and the Growth Plan after the first cluster opened. The Commission says Moldova has unlocked about €504 million under the facility."
  fr_title: "Le sommet UE–Moldova à Bruxelles marque une nouvelle étape vers l’adhésion"
  fr_summary: "Les dirigeants de l’UE et de la Moldova ont examiné les négociations, les réformes et le plan de croissance après l’ouverture du premier groupe. La Commission indique que la Moldova a débloqué environ 504 millions d’euros."
  ru_title: "Саммит ЕС–Молдова в Брюсселе стал новым шагом к членству"
  ru_summary: "Руководители ЕС и Молдовы обсудили переговоры, реформы и План роста после открытия первого кластера. По данным Комиссии, Молдова разблокировала около 504 млн евро в рамках механизма."

- date: 2026-06-15
  source: Comisia Europeană — Enlargement
  url: "https://enlargement.ec.europa.eu/news/enlargement-eu-and-moldova-reach-milestone-accession-talks-opening-first-negotiation-cluster-2026-06-15_en"
  mo_title: "Moldova deschide primul cluster de negocieri: «Fundamente»"
  mo_summary: "Negocierile includ statul de drept, drepturile fundamentale, instituțiile democratice, reforma administrației publice și criteriile economice. UE subliniază că ritmul rămâne bazat pe merite și pe rezultate."
  en_title: "Moldova opens the first accession negotiation cluster: ‘Fundamentals’"
  en_summary: "The negotiations cover the rule of law, fundamental rights, democratic institutions, public administration reform and economic criteria. The EU stresses that the pace remains merit-based and results-driven."
  fr_title: "La Moldova ouvre le premier groupe de négociations: « Fondamentaux »"
  fr_summary: "Les négociations couvrent l’État de droit, les droits fondamentaux, les institutions démocratiques, la réforme de l’administration publique et les critères économiques. L’UE souligne que le rythme repose sur les mérites et les résultats."
  ru_title: "Молдова открыла первый переговорный кластер о вступлении: «Основы»"
  ru_summary: "Переговоры охватывают верховенство права, основные права, демократические институты, реформу госуправления и экономические критерии. ЕС подчёркивает, что темп зависит от заслуг и результатов."

- date: 2026-06-03
  source: Comisia Europeană — Enlargement
  url: "https://enlargement.ec.europa.eu/news/commissioner-kos-visits-moldova-advance-eu-accession-reforms-and-investments-2026-06-03_en"
  mo_title: "Comisara Marta Kos discută la Chișinău reformele și investițiile europene"
  mo_summary: "Vizita a inclus discuții despre justiție și Planul de creștere, prima Conferință de investiții UE–Moldova și Summitul digital al Moldovei, cu accent pe inovare și integrarea europeană."
  en_title: "Commissioner Marta Kos discusses EU reforms and investment in Chișinău"
  en_summary: "The visit covered justice reforms and the Growth Plan, the first EU–Moldova Investment Conference and Moldova Digital Summit, with a focus on innovation and European integration."
  fr_title: "La commissaire Marta Kos discute des réformes et des investissements européens à Chișinău"
  fr_summary: "La visite a porté sur la justice et le plan de croissance, la première conférence d’investissement UE–Moldova et le sommet numérique de la Moldova, avec un accent sur l’innovation et l’intégration européenne."
  ru_title: "Комиссар Марта Кос обсудила в Кишинёве европейские реформы и инвестиции"
  ru_summary: "В ходе визита обсуждались судебная реформа и План роста, первая инвестиционная конференция ЕС–Молдова и Цифровой саммит Молдовы с акцентом на инновации и европейскую интеграцию."

- date: 2026-05-05
  source: Comisia Europeană — Energy
  url: "https://energy.ec.europa.eu/news/eu-moldova-high-level-energy-dialogue-renewed-commitment-closer-energy-cooperation-2026-05-05_en"
  mo_title: "Dialogul energetic UE–Moldova reafirmă apropierea pieței energetice"
  mo_summary: "La al șaptelea dialog de nivel înalt, părțile au discutat securitatea energetică, pregătirea sezonieră, reformele pieței, infrastructura și energia regenerabilă, legând aceste reforme de parcursul de aderare."
  en_title: "EU–Moldova energy dialogue reaffirms closer integration of energy markets"
  en_summary: "At the seventh high-level dialogue, the parties discussed energy security, seasonal preparedness, market reforms, infrastructure and renewables, linking these reforms to Moldova’s accession path."
  fr_title: "Le dialogue énergétique UE–Moldova confirme le rapprochement des marchés de l’énergie"
  fr_summary: "Lors du septième dialogue de haut niveau, les parties ont abordé la sécurité énergétique, la préparation saisonnière, les réformes du marché, les infrastructures et les énergies renouvelables, en reliant ces réformes au parcours d’adhésion."
  ru_title: "Энергетический диалог ЕС–Молдова подтвердил сближение энергетических рынков"
  ru_summary: "На седьмом диалоге высокого уровня обсуждались энергетическая безопасность, сезонная готовность, реформы рынков, инфраструктура и возобновляемая энергия; эти реформы связаны с путём к вступлению."

- date: 2026-04-29
  source: Le Monde
  url: "https://www.lemonde.fr/en/international/article/2026/04/29/moldovan-president-maia-sandu-for-us-joining-the-eu-is-not-just-a-dream-but-a-survival-strategy-as-a-democratic-state_6752957_4.html"
  mo_title: "Maia Sandu: aderarea la UE este o strategie de supraviețuire pentru un stat democratic"
  mo_summary: "Într-un interviu pentru Le Monde, președinta leagă integrarea europeană de consolidarea democrației, reformarea justiției și protejarea suveranității Moldovei."
  en_title: "Maia Sandu: joining the EU is a survival strategy for a democratic state"
  en_summary: "In an interview with Le Monde, the president links European integration to strengthening democracy, reforming justice and protecting Moldova’s sovereignty."
  fr_title: "Maia Sandu: l’adhésion à l’UE est une stratégie de survie pour un État démocratique"
  fr_summary: "Dans un entretien au Monde, la présidente relie l’intégration européenne au renforcement de la démocratie, à la réforme de la justice et à la protection de la souveraineté moldave."
  ru_title: "Майя Санду: вступление в ЕС — стратегия выживания демократического государства"
  ru_summary: "В интервью Le Monde президент связывает европейскую интеграцию с укреплением демократии, реформой правосудия и защитой суверенитета Молдовы."

- date: 2026-04-21
  source: Consiliul UE
  url: "https://www.consilium.europa.eu/en/press/press-releases/2026/04/21/republic-of-moldova-eu-restrictive-measures-extended-until-april-2027/"
  mo_title: "UE prelungește până în aprilie 2027 măsurile împotriva acțiunilor de destabilizare a Moldovei"
  mo_summary: "Consiliul UE a extins cadrul de sancțiuni pentru persoane și entități responsabile de acțiuni care amenință suveranitatea, independența, democrația sau securitatea Moldovei."
  en_title: "The EU extends measures against actions destabilising Moldova until April 2027"
  en_summary: "The Council of the EU extended the sanctions framework for people and entities responsible for actions threatening Moldova’s sovereignty, independence, democracy or security."
  fr_title: "L’UE prolonge jusqu’en avril 2027 les mesures contre les actions déstabilisant la Moldova"
  fr_summary: "Le Conseil de l’UE a prolongé le cadre de sanctions visant les personnes et entités responsables d’actions menaçant la souveraineté, l’indépendance, la démocratie ou la sécurité de la Moldova."
  ru_title: "ЕС продлил до апреля 2027 года меры против действий, дестабилизирующих Молдову"
  ru_summary: "Совет ЕС продлил санкционный режим в отношении лиц и организаций, ответственных за действия, угрожающие суверенитету, независимости, демократии или безопасности Молдовы."

- date: 2026-03-17
  source: Comisia Europeană — Enlargement
  url: "https://enlargement.ec.europa.eu/news/commission-delivers-additional-eu189-million-under-reform-and-growth-facility-moldova-2026-03-17_en"
  mo_title: "Comisia Europeană deblochează încă 189 milioane € pentru Planul de creștere al Moldovei"
  mo_summary: "Plata suplimentară urmează evaluării îndeplinirii a 24 de indicatori de reformă și combină sprijin bugetar cu finanțare pentru investiții, condiționată de rezultate."
  en_title: "The European Commission unlocks another €189 million for Moldova’s Growth Plan"
  en_summary: "The additional payment follows an assessment that 24 reform indicators were met and combines budget support with investment financing tied to results."
  fr_title: "La Commission européenne débloque 189 millions d’euros supplémentaires pour le plan de croissance de la Moldova"
  fr_summary: "Le versement supplémentaire suit l’évaluation de 24 indicateurs de réforme remplis et combine un soutien budgétaire avec un financement des investissements conditionné aux résultats."
  ru_title: "Еврокомиссия разблокировала ещё 189 млн евро для Плана роста Молдовы"
  ru_summary: "Дополнительная выплата последовала после оценки выполнения 24 показателей реформ и сочетает бюджетную поддержку с финансированием инвестиций, зависящим от результатов."

- date: 2026-01-05
  source: Comisia Europeană — Culture and Creativity
  url: "https://culture.ec.europa.eu/fr/news/moldova-officially-joins-creative-europe?etrans=ro"
  mo_title: "Moldova intră oficial în programul Europa Creativă"
  mo_summary: "De la 1 ianuarie 2026, organizațiile, artiștii și profesioniștii culturali din Moldova pot participa la acțiunile culturale ale programului UE în condiții egale cu partenerii europeni."
  en_title: "Moldova officially joins the Creative Europe programme"
  en_summary: "From 1 January 2026, Moldovan organisations, artists and cultural professionals can take part in the EU programme’s cultural actions on equal terms with European partners."
  fr_title: "La Moldova rejoint officiellement le programme Europe créative"
  fr_summary: "Depuis le 1er janvier 2026, les organisations, artistes et professionnels de la culture moldaves peuvent participer aux actions culturelles du programme de l’UE dans les mêmes conditions que leurs partenaires européens."
  ru_title: "Молдова официально присоединилась к программе «Креативная Европа»"
  ru_summary: "С 1 января 2026 года молдавские организации, художники и работники культуры могут участвовать в культурных мероприятиях программы ЕС на равных условиях с европейскими партнёрами."

- date: 2026-01-01
  source: Comisia Europeană — Digital Strategy
  url: "https://digital-strategy.ec.europa.eu/en/news/roaming-now-fully-operational-moldova"
  mo_title: "Regimul «Roam Like at Home» se aplică și în Moldova"
  mo_summary: "Din 1 ianuarie, serviciile mobile dintre Moldova și statele UE pot fi folosite la tarife interne, un rezultat practic al apropierii de piața digitală europeană."
  en_title: "‘Roam Like at Home’ is now fully operational in Moldova"
  en_summary: "From 1 January, mobile services between Moldova and EU countries can be used at domestic prices, a practical result of closer alignment with Europe’s digital market."
  fr_title: "Le régime « Roam Like at Home » est désormais pleinement opérationnel en Moldova"
  fr_summary: "Depuis le 1er janvier, les services mobiles entre la Moldova et les pays de l’UE peuvent être utilisés aux tarifs nationaux, un résultat concret du rapprochement avec le marché numérique européen."
  ru_title: "Режим «Roam Like at Home» теперь полностью действует в Молдове"
  ru_summary: "С 1 января мобильными услугами между Молдовой и странами ЕС можно пользоваться по внутренним тарифам — это практический результат сближения с европейским цифровым рынком."
