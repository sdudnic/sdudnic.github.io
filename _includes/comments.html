{% if page.comment_issue_id %}
<section id="comments" class="comments" aria-labelledby="comments-title" data-comments-repo="{{ include.github_account }}" data-comments-issue="{{ page.comment_issue_id }}">
  <h2 id="comments-title">Comentarii</h2>
  <p class="comments__intro">
    Poți <a href="https://github.com/{{ include.github_account }}/issues/{{ page.comment_issue_id }}" target="_blank" rel="noopener noreferrer">lăsa un comentariu pe GitHub</a>.
  </p>
  <div class="comments__list" data-comments-list>
    <p class="comments__status" data-comments-status>Se încarcă comentariile…</p>
  </div>
</section>

<script>
  (() => {
    const root = document.querySelector('[data-comments-repo]');
    if (!root) return;

    const repo = root.dataset.commentsRepo;
    const issue = root.dataset.commentsIssue;
    const list = root.querySelector('[data-comments-list]');
    const cacheKey = `github-comments-${repo}-${issue}`;
    const issueUrl = `https://github.com/${repo}/issues/${issue}`;

    const render = (comments) => {
      list.replaceChildren();

      if (!comments.length) {
        const empty = document.createElement('p');
        empty.className = 'comments__status';
        empty.textContent = 'Nu există încă comentarii.';
        list.append(empty);
        return;
      }

      comments.forEach((comment) => {
        const article = document.createElement('article');
        article.className = 'comment';

        const avatar = document.createElement('img');
        avatar.className = 'comment__avatar';
        avatar.src = comment.user?.avatar_url || '/img/emptyavatar.png';
        avatar.alt = `Avatarul utilizatorului ${comment.user?.login || 'GitHub'}`;
        avatar.loading = 'lazy';
        avatar.referrerPolicy = 'no-referrer';

        const header = document.createElement('header');
        header.className = 'comment__header';

        const userLink = document.createElement('a');
        userLink.className = 'comment__user';
        userLink.href = `https://github.com/${encodeURIComponent(comment.user?.login || '')}`;
        userLink.target = '_blank';
        userLink.rel = 'noopener noreferrer';
        userLink.textContent = comment.user?.login || 'Utilizator GitHub';

        const dateLink = document.createElement('a');
        dateLink.className = 'comment__date';
        dateLink.href = `${issueUrl}#issuecomment-${comment.id}`;
        dateLink.target = '_blank';
        dateLink.rel = 'noopener noreferrer';
        dateLink.textContent = new Intl.DateTimeFormat('ro-RO', {
          dateStyle: 'medium'
        }).format(new Date(comment.created_at));

        header.append(userLink, ' · ', dateLink);

        const body = document.createElement('div');
        body.className = 'comment__body';
        body.innerHTML = comment.body_html || '';

        article.append(avatar, header, body);
        list.append(article);
      });

      const refresh = document.createElement('button');
      refresh.className = 'comments__refresh moldoveneasca-icon-button';
      refresh.type = 'button';
      refresh.textContent = '↻';
      refresh.setAttribute('aria-label', 'Actualizează comentariile');
      refresh.title = 'Actualizează comentariile';
      refresh.dataset.tooltip = 'Actualizează comentariile';
      refresh.addEventListener('click', () => load(true));
      list.append(refresh);
    };

    const load = async (forceRefresh = false) => {
      if (!forceRefresh) {
        try {
          const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
          if (Array.isArray(cached?.comments)) render(cached.comments);
        } catch (error) {
          localStorage.removeItem(cacheKey);
        }
      }

      try {
        const response = await fetch(`https://api.github.com/repos/${repo}/issues/${issue}/comments?per_page=100`, {
          headers: { Accept: 'application/vnd.github.full+json' }
        });

        if (!response.ok) throw new Error(`GitHub API: ${response.status}`);

        const comments = await response.json();
        localStorage.setItem(cacheKey, JSON.stringify({ comments, cachedAt: Date.now() }));
        render(comments);
      } catch (error) {
        if (!list.querySelector('.comment')) {
          list.replaceChildren();
          const message = document.createElement('p');
          message.className = 'comments__status';
          message.textContent = 'Comentariile nu pot fi încărcate acum. Le poți vedea direct pe GitHub.';
          list.append(message);
        }
      }
    };

    load();
  })();
</script>
{% endif %}
