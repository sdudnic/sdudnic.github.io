{%- comment -%}
  Google Analytics 4. This include is called only for production builds when
  site.google_analytics contains a Measurement ID.
{%- endcomment -%}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics | escape }}');
</script>
