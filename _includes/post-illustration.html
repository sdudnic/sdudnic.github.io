{% assign illustration = site.data.blog_illustrations[page.illustration_id] %}
{% if illustration %}
<figure class="post-illustration">
  <a href="{{ illustration.source | escape }}" target="_blank" rel="noopener noreferrer" aria-label="{{ illustration.alt | escape }} — sursa imaginii" title="{{ illustration.changes | escape }}; sursa originală">
    <img src="{{ illustration.image | relative_url }}" alt="{{ illustration.alt | escape }}" width="{{ illustration.width }}" height="{{ illustration.height }}" decoding="async" fetchpriority="high" itemprop="image">
  </a>
  <figcaption>{{ illustration.caption | escape }}<span class="post-illustration__credit">{{ illustration.credit | escape }} · <a href="{{ illustration.license_url | escape }}" target="_blank" rel="noopener noreferrer">{{ illustration.license | escape }}</a></span></figcaption>
</figure>
{% endif %}
