---
layout: default
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header">
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">Publicat la <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%d.%m.%Y" }}</time>{% if page.author %} · <span itemprop="author">{{ page.author | escape }}</span>{% endif %}</p>
  </header>
  <div class="post-content e-content" itemprop="articleBody">
    {% include post-illustration.html %}
    {{ content }}
  </div>
  {% include post-reactions.html %}
  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
