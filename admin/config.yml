# The GitHub backend authenticates through an OAuth server (Netlify or a
# dedicated proxy). Never put a personal access token in this public file.
backend:
  name: github
  repo: sdudnic/sdudnic.github.io
  branch: master

site_url: "https://dudnic.com"
locale: "ro"
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "_posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }
