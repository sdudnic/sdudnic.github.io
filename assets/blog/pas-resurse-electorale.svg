<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Resurse publice și campanie electorală</title><desc id="desc">Promo-LEX: 282 de situații în 2024, circa 91% vizînd PAS și Maia Sandu; 260 în 2025, circa 79% vizînd PAS. Observațiile nu reprezintă automat încălcări sancționate.</desc>
<rect width="640" height="420" fill="#f7f5ef"/>
<g font-family="Arial,sans-serif" fill="#203e49"><text x="36" y="50" font-size="25" font-weight="bold">Statul în campania electorală</text><text x="36" y="80" font-size="17">Situații documentate de Promo-LEX</text>
<text x="36" y="135" font-size="23" font-weight="bold">2024 · 282</text><rect x="36" y="153" width="560" height="37" fill="#dadfdc"/><rect x="36" y="153" width="510" height="37" fill="#ffdb00"/><text x="36" y="220" font-size="20">~91%: PAS și Maia Sandu</text>
<text x="36" y="274" font-size="23" font-weight="bold">2025 · 260</text><rect x="36" y="292" width="560" height="37" fill="#dadfdc"/><rect x="36" y="292" width="442" height="37" fill="#ffdb00"/><text x="36" y="359" font-size="20">~79%: PAS</text>
<text x="36" y="397" font-size="14">Observații ale monitorilor, nu hotărîri de sancționare.</text></g>
</svg>
